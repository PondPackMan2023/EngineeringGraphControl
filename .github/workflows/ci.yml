name: CI

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: PropertyTools
        uses: actions/checkout@v4
        with:
          repository: PondPackMan2023/PropertyTools
          path: PropertyTools

      - name: EngineeringGraphControl
        uses: actions/checkout@v4
        with:
          path: EngineeringGraphControl

      - name: UnitRegistry
        uses: actions/checkout@v4
        with:
          repository: PondPackMan2023/UnitRegistry
          path: UnitRegistry

      - name: WpfAppFramework
        uses: actions/checkout@v4
        with:
          repository: MrMontana1889/wpf-app-framework
          path: wpf-app-framework

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore EngineeringGraphControl/EngineeringGraphControl.slnx

      - name: Build
        run: dotnet build EngineeringGraphControl/EngineeringGraphControl.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test EngineeringGraphControl/EngineeringGraphControl.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
